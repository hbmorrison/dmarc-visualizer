volumes:
  ts_state:

services:

  parsedmarc:
    build: ./parsedmarc/
    volumes:
      - ./files:/input:ro
      - ./output_files:/output
    command: parsedmarc -c /parsedmarc.ini /input/*
    depends_on:
      - elasticsearch
      - tailscale
    network_mode: service:tailscale
    restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.5
    environment:
      - discovery.type=single-node
    volumes:
      - ./elastic_data:/var/share/elasticsearch/data
    depends_on:
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped

  grafana:
    build: ./grafana/
    user: root
    environment:
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
    depends_on:
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME}
    environment:
      - TS_EXTRA_ARGS=--accept-dns=false --advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
    volumes:
      - ts_state:/var/lib/tailscale
      - ./tailscale:/config
    restart: unless-stopped
